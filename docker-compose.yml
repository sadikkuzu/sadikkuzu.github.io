services:
  jekyll:
    image: ruby:3.3
    working_dir: /usr/src/app
    ports:
      - "4000:4000"
    volumes:
      - ./:/usr/src/app
      - bundle:/usr/local/bundle
    command: >
      bash -c "bundle install &&
               bundle exec jekyll serve --host 0.0.0.0 --force_polling"

volumes:
  bundle:
